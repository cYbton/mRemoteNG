name: sysprep.io build

# Builds the portable, self-contained x64 sysprep.io build of mRemoteNG on a GitHub runner - a local build
# on a PC with Smart App Control on gets its freshly built, unsigned DLLs blocked.
# - push to the sysprep branch: builds the zip and attaches it to the run, for testing (warm-up on a PC
#   with Smart App Control on: every file must get through)
# - push of the tag v<version>-sysprep.io.<n> (matching AssemblyInfo): no new build - the zip of the tested
#   branch build of the same commit becomes the latest GitHub release, byte for byte what was tested.
#   Hyper-Lab's deploy picks it up.
# (workflow_dispatch needs the workflow on the fork's default branch, which stays upstream's)
on:
  push:
    branches:
      - sysprep
    tags:
      - 'v*-sysprep.io.*'

permissions: {}

jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Resolve MSBuild environment
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild -ErrorAction Stop).Source
          $dotnetRoot = Split-Path (Get-Command dotnet -ErrorAction Stop).Source -Parent
          $sdkBasePath = (& dotnet --info | Select-String -Pattern '^\s*Base Path:\s*(.+)$' | Select-Object -First 1).Matches[0].Groups[1].Value.Trim()
          "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MSBuildSDKsPath=$(Join-Path $sdkBasePath 'Sdks')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DOTNET_MSBUILD_SDK_RESOLVER_CLI_DIR=$dotnetRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DOTNET_ROOT=$dotnetRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Read version
        id: version
        shell: pwsh
        run: |
          # The committed AssemblyInfo.cs is used as is (TransformOnBuild=false below), so it has to match the template
          $cs = Get-Content mRemoteNG\Properties\AssemblyInfo.cs -Raw
          $tt = Get-Content mRemoteNG\Properties\AssemblyInfo.tt -Raw
          if ($cs -notmatch 'AssemblyVersion\("(?<ver>\d+\.\d+\.\d+)\.(?<rel>\d+)"\)') { throw 'No AssemblyVersion in AssemblyInfo.cs' }
          $version = $Matches['ver']; $release = $Matches['rel']
          if ($tt -notmatch "int sysprepRelease = $release;") { throw "AssemblyInfo.cs (release $release) does not match AssemblyInfo.tt - regenerate it" }
          $name = "$version-sysprep.io.$release"
          "tag=v$name" >> $env:GITHUB_OUTPUT
          "title=mRemoteNG $version (sysprep.io.$release)" >> $env:GITHUB_OUTPUT
          "zip=mRemoteNG-$name-x64.zip" >> $env:GITHUB_OUTPUT
          Write-Host "Building mRemoteNG $name"

      - name: Restore
        shell: pwsh
        run: dotnet restore mRemoteNG\mRemoteNG.csproj -p:Configuration="Release Self-Contained" -p:Platform=x64 -p:SelfContained=true -p:RuntimeIdentifier=win-x64 -p:PublishReadyToRun=true

      - name: Build and publish
        shell: pwsh
        run: |
          & "$env:MSBUILD_EXE" mRemoteNG\mRemoteNG.csproj /p:Configuration="Release Self-Contained" /p:Platform=x64 /p:SelfContained=true /p:RuntimeIdentifier=win-x64 /p:TransformOnBuild=false /p:MSBuildEnableWorkloadResolver=false /p:PublishDir="$env:GITHUB_WORKSPACE\publish\" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Check the publish layout
        shell: pwsh
        run: |
          $dir = "$env:GITHUB_WORKSPACE\publish"
          foreach ($required in 'mRemoteNG.exe', 'mRemoteNG.dll', 'PuTTYNG.exe', 'Assemblies\BouncyCastle.Cryptography.dll', 'Icons\mRemoteNG', 'Icons\NOTICE.md', 'Themes\sysprep.io_dark.vstheme') {
            if (-not (Test-Path (Join-Path $dir $required))) { throw "Missing in the publish folder: $required" }
          }
          # removed from the sysprep.io build: external connectors, translations, SQL Server/MySQL, VNC, WPF
          foreach ($unwanted in 'ExternalConnectors.dll', 'Assemblies\VaultSharp.dll', 'Assemblies\AWSSDK.Core.dll', 'de\mRemoteNG.resources.dll', 'Assemblies\Microsoft.Data.SqlClient.dll', 'Assemblies\MySql.Data.dll', 'Assemblies\VncSharpCore.dll', 'PresentationFramework.dll') {
            if (Test-Path (Join-Path $dir $unwanted)) { throw "Should not be in the publish folder: $unwanted" }
          }
          $binaries = Get-ChildItem $dir -Recurse -File -Include *.dll, *.exe
          $unsigned = $binaries | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          Write-Host "$($binaries.Count) DLL/EXE files, $($unsigned.Count) without a valid signature:"
          $unsigned | ForEach-Object { Write-Host "  $($_.FullName.Substring($dir.Length + 1))" }
          # the fixed binaries from libs\sysprep must ship unchanged (stable hash for Smart App Control)
          foreach ($pinned in 'Interop.MSTSCLib.dll', 'AxInterop.MSTSCLib.dll', 'ObjectListView.dll', 'mRp.Contracts.dll') {
            $published = Get-ChildItem $dir -Recurse -File -Filter $pinned | Select-Object -First 1
            if (-not $published) { throw "Missing in the publish folder: $pinned" }
            if ((Get-FileHash $published.FullName).Hash -ne (Get-FileHash "mRemoteNG\libs\sysprep\$pinned").Hash) { throw "$pinned differs from libs\sysprep\$pinned" }
          }
          # NuGet libraries must keep their publisher's signature (no ReadyToRun rewrite) - see KeepPackageAssembliesOriginal
          foreach ($signedPackage in 'Assemblies\Newtonsoft.Json.dll', 'Assemblies\Microsoft.Data.Sqlite.dll', 'Assemblies\BouncyCastle.Cryptography.dll') {
            if ((Get-AuthenticodeSignature (Join-Path $dir $signedPackage)).Status -ne 'Valid') { throw "$signedPackage lost its signature" }
          }

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\publish\*" -DestinationPath "${{ steps.version.outputs.zip }}"
          Write-Host ("{0}: {1:N1} MB" -f '${{ steps.version.outputs.zip }}', ((Get-Item '${{ steps.version.outputs.zip }}').Length / 1MB))

      - name: Upload zip to the run
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.zip }}
          path: ${{ steps.version.outputs.zip }}
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    runs-on: windows-2025-vs2026
    permissions:
      contents: write   # create the release
      actions: read     # find and download the tested build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $cs = Get-Content mRemoteNG\Properties\AssemblyInfo.cs -Raw
          if ($cs -notmatch 'AssemblyVersion\("(?<ver>\d+\.\d+\.\d+)\.(?<rel>\d+)"\)') { throw 'No AssemblyVersion in AssemblyInfo.cs' }
          $name = "$($Matches['ver'])-sysprep.io.$($Matches['rel'])"
          if ('${{ github.ref_name }}' -ne "v$name") { throw "Tag ${{ github.ref_name }} does not match the version in AssemblyInfo (v$name)" }
          "tag=v$name" >> $env:GITHUB_OUTPUT
          "title=mRemoteNG $($Matches['ver']) (sysprep.io.$($Matches['rel']))" >> $env:GITHUB_OUTPUT
          "zip=mRemoteNG-$name-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Get the tested build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list -R '${{ github.repository }}' --workflow sysprep-build.yml --branch sysprep --commit '${{ github.sha }}' --status success --json databaseId --jq '.[0].databaseId'
          if (-not $run) { throw "No successful build of commit ${{ github.sha }} on the sysprep branch - push it, test it, then tag it" }
          gh run download $run -R '${{ github.repository }}' -n '${{ steps.version.outputs.zip }}' -D tested
          if ($LASTEXITCODE -ne 0) { throw "Zip of run $run not found (artifacts are kept 14 days)" }
          Move-Item "tested\${{ steps.version.outputs.zip }}" .
          Write-Host "Releasing the zip of run $run"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ steps.version.outputs.tag }}' *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release ${{ steps.version.outputs.tag }} exists already - count up sysprepRelease in AssemblyInfo.tt/.cs and tag again" }
          gh release create '${{ steps.version.outputs.tag }}' '${{ steps.version.outputs.zip }}' --title '${{ steps.version.outputs.title }}' --notes-file sysprep\release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }